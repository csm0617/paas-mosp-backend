server:
  # 与厂商 gaop-be 同端口，便于后续整体替换时直接换 Deployment 镜像
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: paas-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  messages:
    # 厂商 i18n 消息包（契约数据，见 paas-core-trigger/src/main/resources/i18n/README.md）：
    # 错误响应的 msg 是本地化文案，必须与厂商逐字一致
    basename: i18n/messages
    encoding: UTF-8
  jackson:
    # 照抄厂商 `application.yml:11-13`：日期统一按 UTC 输出成 `...SSS'Z'` 的字面量格式。
    # 实测影响 `birth`：不配这两行会输出 `2000-01-02T00:00:00.000+00:00`，
    # 而厂商是 `2000-01-01T16:00:00.000Z`（注意 `'Z'` 在厂商那边是**字面量**，靠 time-zone=UTC 兜住）。
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 参数照抄厂商的 k8s profile（`application-k8s.yml:7`）：
    # `characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC`。
    # **`serverTimezone=UTC` 不是随手写的**：它决定 DATE 列（`g_user.birth`）读出来的瞬时值，
    # 换成 Asia/Shanghai 会让 birth 的 ISO 串整体差 8 小时（实测对拉发现）。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gaop}?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:gaop}
    password: ${MYSQL_PASSWORD:gaop123456}
    hikari:
      pool-name: paas-core-hikari
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

mybatis:
  mapper-locations: classpath*:mybatis/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

gaop:
  k8s:
    namespace: ${GAOP_K8S_NAMESPACE:gaop-namespace}
  auth:
    # 同一 (用户,战位) 的并发会话上限；厂商默认 1（单点登录）
    max-login: ${MAX_LOGIN:1}
  gis:
    # 厂商 `application.yml:121-122` 的默认值 `${GIS_URL:gis-server:8080}`；
    # 主机名会被当作 **Deployment 名**去读运行状态（`GET /v1/licence/gisStatus`）
    url: ${GIS_URL:gis-server:8080}
  gateway:
    # 通知网关刷新规则的目标（厂商 `gaop.gateway.*`）：本地 profile 默认 `gateway`、
    # k8s profile 默认 `gaop-gateway-auth`（`application-k8s.yml:38-40`）。这里取 k8s 那个值，
    # 因为本后端的目标是替换集群里的 gaop-be。调用是 fire-and-forget，解析不了也不影响响应。
    host: ${GAOP_GATEWAY_HOST:gaop-gateway-auth}
    port: ${GAOP_GATEWAY_PORT:5000}

logging:
  level:
    root: INFO
    com.csm.paas.core: INFO
