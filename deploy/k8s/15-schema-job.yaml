# 灌 schema Job（建库 / 建用户 / 87 个迁移）
#
# 与厂商 `deploy-msop.sh` 的关键差异：厂商在**宿主机上**用
#   `docker run --rm --network host mysql:8.0.32 ...` + 硬编码集群 IP `10.96.1.127`
# 来灌 SQL。这在三种现场会直接失败：
#   ① 目标机没有 docker CLI（只有 containerd / podman）；
#   ② 集群 Service 网段不是 10.96.0.0/12；
#   ③ 气隙机上没有 mysql:8.0.32 镜像。
# 本包改为**集群内 Job**：镜像随包分发、按 Service DNS 解析、不需要宿主机任何工具。
#
# 占位符：__NS__ __MYSQL_IMAGE__ __MYSQL_HOST__ __MYSQL_PORT__ __DB_NAME__ __APP_USER__
---
apiVersion: batch/v1
kind: Job
metadata:
  name: paas-schema
  namespace: __NS__
  labels:
    app: paas-schema
    app.kubernetes.io/part-of: msop
spec:
  # 失败即停：schema 灌一半再重试会撞 "table already exists"，把真实原因掩盖掉
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: paas-schema
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-client
          image: __MYSQL_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              value: __MYSQL_HOST__
            - name: MYSQL_PORT
              value: "__MYSQL_PORT__"
            - name: DB_NAME
              value: __DB_NAME__
            - name: APP_USER
              value: __APP_USER__
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paas-db
                  key: MYSQL_PASSWORD
            # root 口令可选：为空时跳过「建库+建用户」，只灌 schema
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paas-db
                  key: MYSQL_ROOT_PASSWORD
                  optional: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              ok=0; fail=0; failed=""

              # 管理员连接：优先用单独的 root 口令；若应用账号本身就是 root，
              # 则用同一个口令登录。**绝不能对 root 执行 ALTER USER**——现场 root
              # 口令是既成事实，改掉就等于把数据库锁死。
              ADMIN=""
              if [ -n "${ROOT_PASSWORD:-}" ]; then
                ADMIN="-uroot -p${ROOT_PASSWORD}"
                echo "== 建库（管理员 root，口令来自 MYSQL_ROOT_PASSWORD）=="
              elif [ "${APP_USER}" = "root" ]; then
                ADMIN="-uroot -p${APP_PASSWORD}"
                echo "== 建库（管理员 root，口令来自 MYSQL_PASSWORD）=="
              else
                echo "== 未提供管理员口令，假定库与账号已存在 =="
              fi

              if [ -n "${ADMIN}" ]; then
                # shellcheck disable=SC2086
                mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" ${ADMIN} -e "
                  CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\` DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;" \
                  || { echo "!! 建库失败（管理员口令或网络不对）"; exit 1; }

                if [ "${APP_USER}" != "root" ]; then
                  # shellcheck disable=SC2086
                  mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" ${ADMIN} -e "
                    CREATE USER IF NOT EXISTS '${APP_USER}'@'%' IDENTIFIED WITH mysql_native_password BY '${APP_PASSWORD}';
                    ALTER USER '${APP_USER}'@'%' IDENTIFIED WITH mysql_native_password BY '${APP_PASSWORD}';
                    GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${APP_USER}'@'%';
                    FLUSH PRIVILEGES;" || { echo "!! 建账号失败"; exit 1; }
                  echo "   应用账号 ${APP_USER} 已就绪"
                else
                  echo "   应用账号即 root，跳过建/改用户"
                fi
              fi

              echo "== 灌入迁移 =="
              # 顺序以 order.txt 为准（取自厂商 install-paas-init-sql.yml 的 sql_items）。
              # 不能用 sort -V：V0.8.3 的两个文件厂商顺序是
              #   V0.8.3__alter-language-table-character-set.sql → V0.8.3_update_setting_table.sql
              # 而 sort -V 会反过来。ordered 缺失时才退回 sort -V。
              if [ -f /sql/order.txt ]; then
                ORDER="$(grep -v '^#' /sql/order.txt | grep '\.sql$')"
                echo "   按 order.txt（$(printf '%s\n' "$ORDER" | wc -l | tr -d ' ') 项）"
              else
                ORDER="$(ls /sql/*.sql | sort -V)"
                echo "   未找到 order.txt，退回 sort -V（$(printf '%s\n' "$ORDER" | wc -l | tr -d ' ') 个）"
              fi
              for name in $ORDER; do
                case "$name" in
                  /*) f="$name" ;;
                  *)  f="/sql/$name" ;;
                esac
                if mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$APP_USER" -p"$APP_PASSWORD" "$DB_NAME" < "$f" 2>/tmp/err; then
                  ok=$((ok+1))
                else
                  fail=$((fail+1)); failed="$failed $(basename "$f")"
                  echo "   FAILED $(basename "$f")"
                  sed -n '1,3p' /tmp/err | sed 's/^/      /'
                fi
              done
              echo "   成功=$ok 失败=$fail"

              echo "== 核验 =="
              mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$APP_USER" -p"$APP_PASSWORD" -N -B -e "
                SELECT CONCAT('表数=', COUNT(*)) FROM information_schema.tables WHERE table_schema='$DB_NAME';"

              if [ "$fail" -ne 0 ]; then
                echo "!! 有迁移失败：$failed"
                echo "   常见原因：库非空（已灌过）、或账号缺少 DDL 权限。不要盲目重试。"
                exit 1
              fi
              echo "== schema 完成 =="
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        # 87 个迁移以目录形式挂载（ConfigMap 的每个 key 就是一个 .sql 文件），
        # 保留原文件名与顺序信息；总大小约 150KB，未触碰 ConfigMap 1MB 上限
        - name: sql
          configMap:
            name: paas-schema-sql
